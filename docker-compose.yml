services:
  backend:
    build:
      context: ./backend
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 9501
      DATABASE_PATH: data/gateway.db
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      MCP_API_KEY: ${MCP_API_KEY:-dev-mcp-key}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-replace-with-a-long-random-secret}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-true}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "9501:9501"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  gateway-data:
